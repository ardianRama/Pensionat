<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kundinformation</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/Theme/bootstrap.min.css}">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <div th:if="${messageUpdateCustomer}" class="alert alert-danger" role="alert">
        <span th:text="${messageUpdateCustomer}"></span>
      </div>

      <div th:if="${errorUpdateCustomer}" class="alert alert-danger" role="alert">
        <span th:text="${errorUpdateCustomer}"></span>
      </div>

      <!-- Uppdateringsformulär -->
      <form th:action="@{/update-customer}" th:object="${customer}" method="post" class="mb-4">
        <div class="form-group mb-3">
          <label for="name">Namn</label>
          <input type="text" id="name" th:field="*{name}" class="form-control" required />
        </div>
        <div class="form-group mb-3">
          <label for="email">E-post</label>
          <input type="email" id="email" th:field="*{email}" class="form-control" required />
        </div>
        <div class="form-group mb-3">
          <label for="phoneNumber">Telefon</label>
          <input type="text" id="phoneNumber" th:field="*{phoneNumber}" class="form-control" />
        </div>
        <div class="form-group mb-3">
          <label for="address">Adress</label>
          <input type="text" id="address" th:field="*{address}" class="form-control" />
        </div>

        <button type="submit" class="btn btn-success">Uppdatera kund</button>
      </form>

    </div>
  </div>
</div>

</body>
</html>
