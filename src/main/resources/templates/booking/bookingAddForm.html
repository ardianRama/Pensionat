<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Add Booking</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>

<h1>Add a New Booking</h1>

<!-- Lyckomeddelande -->
<div th:if="${serviceMessage}" class="message" style="color: green; text-align: center; margin-bottom: 20px;">
  <p th:text="${serviceMessage}"></p>
</div>

<!-- Felmeddelande -->
<div th:if="${serviceError}" class="error-message" style="color: red; text-align: center; margin-bottom: 20px;">
  <p th:text="${serviceError}"></p>
</div>

<!-- Tillbaka-knapp -->
<div style="text-align: center; margin-bottom: 20px;">
  <a href="/booking/list" class="back-to-button">Back To Bookings</a>
</div>

<form th:action="@{/booking/add}" th:object="${booking}" method="post">

  <label for="checkIn">Check-in date:</label>
  <input type="date" id="checkIn" th:field="*{checkIn}" />
  <div th:if="${#fields.hasErrors('checkIn')}" style="color: red;" th:errors="*{checkIn}"></div>

  <br/>

  <label for="checkOut">Check-out date:</label>
  <input type="date" id="checkOut" th:field="*{checkOut}" />
  <div th:if="${#fields.hasErrors('checkOut')}" style="color: red;" th:errors="*{checkOut}"></div>

  <br/>

  <label for="extraBeds">Extra beds:</label>
  <input type="number" id="extraBeds" min="0" max="2" th:field="*{extraBeds}" />
  <div th:if="${#fields.hasErrors('extraBeds')}" style="color: red;" th:errors="*{extraBeds}"></div>

  <br/>

  <label for="numberOfGuests">Number of guests:</label>
  <input type="number" id="numberOfGuests" min="1" max="4" th:field="*{numberOfGuests}" />
  <div th:if="${#fields.hasErrors('numberOfGuests')}" style="color: red;" th:errors="*{numberOfGuests}"></div>

  <br/>

  <label for="customer">Customer:</label>
  <select id="customer" th:field="*{customer.id}">
    <option value="" disabled selected>Select customer</option>
    <option th:each="cust : ${customers}"
            th:value="${cust.id}"
            th:text="${cust.name + ' (' + cust.email + ')'}"></option>
  </select>
  <div th:if="${#fields.hasErrors('customer')}" style="color: red;" th:errors="*{customer}"></div>

  <br/>

  <label for="room">Room:</label>
  <select id="room" th:field="*{room.id}">
    <option value="" disabled selected>Select room</option>
    <option th:each="room : ${rooms}"
            th:value="${room.id}"
            th:text="${room.roomNumber}"></option>
  </select>
  <div th:if="${#fields.hasErrors('room')}" style="color: red;" th:errors="*{room}"></div>

  <br/><br/>

  <button type="submit">Add Booking</button>

</form>

</body>
</html>
