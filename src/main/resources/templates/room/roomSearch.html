<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Search Available Rooms</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>

<h1>Search Available Rooms</h1>

<div style="text-align: center; margin-top: 20px;">
  <a href="/room/list" class="">Back to Room List</a>
</div>

<form th:action="@{/room/search}" method="get">
  <label for="checkIn">Check-in date:</label>
  <input type="date" id="checkIn" name="checkIn"
         th:value="${checkIn}" required />

  <label for="checkOut">Check-out date:</label>
  <input type="date" id="checkOut" name="checkOut"
         th:value="${checkOut}" required />

  <label for="guests">Number of guests:</label>
  <input type="number" id="guests" name="guests" min="1"
         th:value="${guests}" required />

  <button type="submit">Search</button>
</form>

<div th:if="${noResults}">
  <p th:text="${noResults}" style="color: red; margin-top: 20px;"></p>
</div>

<div th:if="${availableRooms}">
  <h2 style="text-align: center;">Available Rooms</h2>
  <table border="1" cellpadding="5" cellspacing="0" style="margin-top: 15px;">
    <thead>
    <tr>
      <th>Room Number</th>
      <th>Room Type</th>
      <th>Base Capacity</th>
      <th>Max Extra Beds</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="room : ${availableRooms}">
      <td th:text="${room.roomNumber}">101</td>
      <td th:text="${room.roomType}">DOUBLE</td>
      <td th:text="${room.baseCapacity}">2</td>
      <td th:text="${room.maxExtraBeds}">1</td>
    </tr>
    </tbody>
  </table>
</div>

</body>
</html>
