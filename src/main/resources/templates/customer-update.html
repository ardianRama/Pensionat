<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uppdatera Kund</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/Theme/bootstrap.min.css}">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-sm">
                <div class="card-header text-center">
                    <h4>Uppdatera Kundinformation</h4>
                </div>
                <div class="card-body">

                    <div th:if="${message2}" class="alert alert-success" role="alert">
                        <span th:text="${message2}"></span>
                    </div>
                    <div th:if="${error2}" class="alert alert-danger" role="alert">
                        <span th:text="${error2}"></span>
                    </div>

                    <form th:action="@{/update-customer}" method="post" th:object="${customerDto}">
                        <input type="hidden" th:field="*{email}" />

                        <div class="mb-3">
                            <label for="name" class="form-label">Namn:</label>
                            <input type="text" th:field="*{name}" class="form-control" id="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="phoneNumber" class="form-label">Telefonnummer:</label>
                            <input type="text" th:field="*{phoneNumber}" class="form-control" id="phoneNumber">
                        </div>
                        <div class="mb-3">
                            <label for="address" class="form-label">Adress:</label>
                            <input type="text" th:field="*{address}" class="form-control" id="address">
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary mt-3">Spara Uppdatering</button>
                            <a th:href="@{/customer-management}" class="btn btn-secondary mt-2">Avbryt och Gå Tillbaka</a>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
