<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update Customer</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>

<h1>Update Customer</h1>

<form th:action="@{'/customer/' + ${customer.id} + '/update'}" th:object="${customer}" method="post">

    <div>
        <label>Name:</label>
        <input type="text" th:field="*{name}" />
        <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error"></div>
    </div>

    <div>
        <label>Email:</label>
        <input type="email" th:field="*{email}" />
        <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error"></div>
    </div>

    <div>
        <label>Phone Number:</label>
        <input type="text" th:field="*{phoneNumber}" />
        <div th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}" class="error"></div>
    </div>

    <div>
        <label>Address:</label>
        <input type="text" th:field="*{address}" />
        <div th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="error"></div>
    </div>

    <div style="margin-top: 15px;">
        <button type="submit">Update</button>
        <a th:href="@{/customer/list}">Cancel</a>
    </div>
</form>

</body>
</html>
