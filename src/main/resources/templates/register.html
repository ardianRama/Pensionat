<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registrera</title>
</head>
<body>
<h2>Registrera</h2>

<form th:action="@{/register}" th:object="${customer}" method="post">

    <p th:if="${error}" th:text="${error}" style="color:red;"></p>

    <label for="username">Användarnamn:</label>
    <input type="text" th:field="*{username}" id="username" required><br><br>

    <label for="password">Lösenord:</label>
    <input type="password" th:field="*{password}" id="password" required><br><br>

    <label for="name">Namn:</label>
    <input type="text" th:field="*{name}" id="name" required><br><br>

    <label for="email">E-post:</label>
    <input type="email" th:field="*{email}" id="email" required><br><br>

    <label for="phonenumber">Telefonnummer:</label>
    <input type="text" th:field="*{phoneNumber}" id="phonenumber" required><br><br>

    <label for="address">Adress:</label>
    <input type="text" th:field="*{address}" id="address" required><br><br>

    <button type="submit">Registrera</button>
</form>

</body>
</html>
