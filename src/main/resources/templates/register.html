<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrera</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <!-- Theme -->
    <link rel="stylesheet" th:href="@{/theme/bootstrap.min.css}">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-sm">
                <div class="card-header text-center">
                    <h4>Registrera kund</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/register}" th:object="${customer}" method="post">
                        <div class="mb-3">
                            <label for="customerName" class="form-label">Namn</label>
                            <input type="text" class="form-control" id="customerName" th:field="*{name}" required>
                        </div>

                        <div class="mb-3">
                            <label for="customerEmail" class="form-label">E-post</label>
                            <input type="email" class="form-control" id="customerEmail" th:field="*{email}" required>
                        </div>

                        <div class="mb-3">
                            <label for="customerPhone" class="form-label">Telefon</label>
                            <input type="text" class="form-control" id="customerPhone" th:field="*{phoneNumber}" required>
                        </div>

                        <div class="mb-3">
                            <label for="customerAddress" class="form-label">Adress</label>
                            <input type="text" class="form-control" id="customerAddress" th:field="*{address}" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Registrera</button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
